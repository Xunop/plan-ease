services:
  plan-ease-server:
    image: plan-ease-server:v0.0.1
    container_name: plan-ease-server
    ports:
      - "1234:1234"
    volumes:
      - plan_ease_server_data:/data
    # environment:
    #   - DATABASE_FILE=/data/planease.db
    #   - NODE_ENV=production
    restart: unless-stopped

  plan-ease:
    image: plan-ease:v0.0.1
    container_name: plan-ease
    ports:
      - "3000:3000"
    # environment:
      # - PROVIDER_WEBSOCKET_URL=ws://plan-ease-server:1234
      # - NODE_ENV=production
    depends_on:
      - plan-ease-server

    restart: unless-stopped

volumes:
  plan_ease_server_data:
